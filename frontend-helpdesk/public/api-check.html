<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>API Check</title>
  </head>
  <body>
    <pre id="out">checking...</pre>
    <script>
      (async () => {
        const token = window.localStorage.getItem("access_token");
        const out = [];
        for (const url of ["/api/user-info", "/api/tickets"]) {
          try {
            const res = await fetch(url, {
              headers: { Authorization: "Bearer " + token },
            });
            out.push({
              url,
              ok: res.ok,
              status: res.status,
              text: (await res.text()).slice(0, 180),
            });
          } catch (error) {
            out.push({ url, error: String(error) });
          }
        }
        document.getElementById("out").textContent = JSON.stringify(out, null, 2);
      })();
    </script>
  </body>
</html>
